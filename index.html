<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThiQuiro - Quiropraxia</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            padding: 50px; 
            background-color: #f4f9f9; 
            color: #333; 
            margin: 0;
        }
        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            background: white; 
            padding: 50px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        h1 { 
            color: #1e5b5a; 
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        p { 
            font-size: 1.2em; 
            line-height: 1.6;
            color: #555;
        }
        .btn { 
            display: inline-block; 
            margin-top: 30px; 
            padding: 12px 30px; 
            background-color: #1e5b5a; 
            color: white; 
            text-decoration: none; 
            border-radius: 6px; 
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #144241;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bem-vindo à ThiQuiro</h1>
        <p>Em breve, nosso novo site estará no ar.</p>
        <p>Aqui você poderá agendar consultas, acessar a área do paciente e conferir dicas sobre quiropraxia.</p>
        <a href="#" class="btn">Fale Conosco</a>
    </div>
</body>
</html>
